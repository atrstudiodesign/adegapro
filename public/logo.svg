<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring with Neon Glow -->
  <circle cx="100" cy="100" r="92" fill="url(#badgeGlow)" stroke="url(#goldRing)" stroke-width="4" filter="url(#neon)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Beer Mug on Top Left -->
  <g transform="translate(42, 38) rotate(-15)">
    <rect x="0" y="8" width="22" height="26" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
    <path d="M22 13h5a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-5" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <!-- Foam -->
    <path d="M-2 8c0-3 3-5 6-4 2-3 6-3 8 0 2-2 5-2 7 0 2 0 4 2 4 4z" fill="#ffffff"/>
  </g>

  <!-- Bottle on Top Right -->
  <g transform="translate(136, 32) rotate(15)">
    <rect x="5" y="0" width="6" height="8" rx="1" fill="#15803d"/>
    <path d="M5 8c-2 4-5 8-5 13v15a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4V21c0-5-3-9-5-13z" fill="#16a34a" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="2" y="22" width="12" height="10" rx="1" fill="#fef08a" opacity="0.85"/>
  </g>

  <!-- Arch text: TOME NO SEU -->
  <path id="archPath" d="M 45 92 A 65 65 0 0 1 155 92" fill="none"/>
  <text fill="#fef08a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" letter-spacing="2">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">
      TOME NO SEU
    </textPath>
  </text>

  <!-- Central Bold TOBA typography with 3D shadow -->
  <text x="100" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="1" fill="#0c4a6e" stroke="#0369a1" stroke-width="6" stroke-linejoin="round">TOBA</text>
  <text x="100" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="1" fill="url(#chromeText)" stroke="#ffffff" stroke-width="1.5">TOBA</text>

  <!-- Subtitle Tag -->
  <rect x="45" y="146" width="110" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#e2e8f0" letter-spacing="1.5">ADEGA &amp; CONVENIÊNCIA</text>
</svg>
