<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADEGA PRO</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#241b08 0,#0d0d0d 42%,#050505 100%)}
.card{text-align:center}
img{width:112px;height:112px;object-fit:contain;border-radius:24px;box-shadow:0 0 40px rgba(245,158,11,.15)}
h1{margin:22px 0 6px;font-size:30px;letter-spacing:2px}
p{margin:0;color:#a3a3a3;font-size:13px}
.bar{width:260px;height:3px;margin:28px auto 0;background:#262626;border-radius:99px;overflow:hidden}
.bar:after{content:"";display:block;width:42%;height:100%;background:#f59e0b;border-radius:99px;animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(350%)}}
small{display:block;margin-top:18px;color:#666;font-size:10px;letter-spacing:.8px}
</style>
</head>
<body><div class="wrap"><div class="card">
<img src="../src-tauri/icons/icon.png" alt="ADEGA PRO">
<h1>ADEGA PRO</h1>
<p>Conectando ao sistema da sua adega...</p>
<div class="bar"></div>
<small>Windows 7 Legacy • sincronizado com o ADEGA PRO Online</small>
</div></div></body></html>
