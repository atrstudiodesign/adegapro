name: ADEGA PRO Desktop Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

concurrency:
  group: adega-pro-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Gerar instaladores Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Compilar aplicativo
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis,msi

      - name: Validar metadados do executável
        shell: pwsh
        run: |
          $expectedVersion = "1.1.4"
          $binary = Get-Item "src-tauri/target/release/adega-pro.exe"
          $info = $binary.VersionInfo

          if ($info.FileDescription -ne "ADEGA PRO") {
            throw "FileDescription inválido: $($info.FileDescription)"
          }
          if ($info.ProductName -ne "ADEGA PRO") {
            throw "ProductName inválido: $($info.ProductName)"
          }
          if ($info.CompanyName -ne "ATR Studio Design") {
            throw "CompanyName inválido: $($info.CompanyName)"
          }
          if (-not $info.FileVersion.StartsWith($expectedVersion)) {
            throw "FileVersion inválido: $($info.FileVersion)"
          }
          if (-not $info.ProductVersion.StartsWith($expectedVersion)) {
            throw "ProductVersion inválido: $($info.ProductVersion)"
          }

          @"
          FileDescription=$($info.FileDescription)
          ProductName=$($info.ProductName)
          CompanyName=$($info.CompanyName)
          FileVersion=$($info.FileVersion)
          ProductVersion=$($info.ProductVersion)
          LegalCopyright=$($info.LegalCopyright)
          "@ | Set-Content "src-tauri/target/release/version-info.txt"

      - name: Publicar instaladores como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ADEGA-PRO-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/version-info.txt
