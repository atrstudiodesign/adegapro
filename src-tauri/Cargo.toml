[package]
name = "adega-pro"
version = "1.1.2"
description = "ADEGA PRO — Sistema para Adegas"
authors = ["ATR Studio Design"]
edition = "2021"

[lib]
name = "adega_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
